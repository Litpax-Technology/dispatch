<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #202124; background: #fff; }
  .wrap { padding: 12px; }
  label { display: block; font-weight: 600; margin: 8px 0 4px; color: #5f6368; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  select { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #dadce0; border-radius: 6px; background: #fff; }

  .counter { margin-top: 14px; font-size: 32px; font-weight: 700; text-align: center; color: #1a73e8; }
  .track { height: 8px; background: #e8eaed; border-radius: 4px; overflow: hidden; margin: 4px 0 12px; }
  .bar { height: 100%; width: 0; background: #34a853; transition: width .2s; }

  #scan { width: 100%; padding: 12px; font-size: 18px; font-family: monospace; border: 3px solid #f9a825; border-radius: 8px; background: #fffde7; outline: none; }
  #scan:focus { border-color: #1a73e8; background: #fff; }

  .msg { margin-top: 10px; padding: 10px; border-radius: 6px; font-weight: 600; background: #f1f3f4; color: #3c4043; min-height: 40px; }
  .msg.ok   { background: #e6f4ea; color: #137333; }
  .msg.err  { background: #fce8e6; color: #c5221f; }
  .msg.done { background: #d2e3fc; color: #174ea6; }
  .msg.warn { background: #fef7e0; color: #b06000; }

  .head { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 6px; }
  .head button { border: 1px solid #dadce0; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; }

  #recent { list-style: none; margin: 0; padding: 0; }
  #recent li { display: flex; justify-content: space-between; gap: 6px; padding: 5px 6px; border-bottom: 1px solid #f1f3f4; font-family: monospace; font-size: 12px; }
  #recent li .note { font-family: inherit; color: #5f6368; font-size: 11px; text-align: right; }
  #recent li.wait { color: #9aa0a6; }
  #recent li.ok   { color: #137333; }
  #recent li.err  { color: #c5221f; background: #fce8e6; }

  .lost { position: fixed; inset: 0; background: rgba(197, 34, 31, .92); color: #fff; font-size: 20px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  .lost span { font-size: 14px; font-weight: 400; margin-top: 8px; }
  .hidden { display: none; }
</style>
